version: "3.8"

services:
  mlflow:
    image: python:3.12-slim
    command: >
      bash -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///mlruns.db --default-artifact-root ./artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns.db:/mlruns.db
      - ./artifacts:/artifacts

  api:
    build: .
    command: uvicorn ci.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  ui:
    build: .
    command: streamlit run src/ci/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - api
